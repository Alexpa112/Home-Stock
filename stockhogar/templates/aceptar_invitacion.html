<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aceptar invitación - Dreame!</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script>
  (function () {
    var guardado = localStorage.getItem("stockhogar-tema");
    if (guardado) document.documentElement.dataset.theme = guardado;
  })();
</script>
<style>
  .pantalla-invitacion {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .tarjeta-invitacion {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 28px;
    width: 100%;
    max-width: 400px;
    box-shadow: var(--shadow-md);
    text-align: center;
  }
  .tarjeta-invitacion h1 { margin: 0 0 12px 0; font-size: 1.3rem; }
  .tarjeta-invitacion p { margin: 8px 0; color: var(--text-soft); }
  .estado-cargando {
    font-size: 3rem;
    margin: 20px 0;
    animation: spin 1s linear infinite;
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .estado-exito {
    color: #4CAF50;
    font-size: 3rem;
    margin: 20px 0;
  }
  .estado-error {
    color: #f44336;
    font-size: 3rem;
    margin: 20px 0;
  }
  .mensaje-error {
    color: var(--danger);
    padding: 12px;
    background: var(--surface-2);
    border-radius: var(--radius-sm);
    margin: 16px 0;
  }
  .boton-volver {
    display: inline-block;
    margin-top: 16px;
    padding: 10px 20px;
    background: var(--accent);
    color: var(--accent-contrast);
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    text-decoration: none;
    font-weight: 600;
  }
  .boton-volver:hover {
    opacity: 0.9;
  }
</style>
</head>
<body>

<div class="pantalla-invitacion">
  <div class="tarjeta-invitacion">
    <h1>📦 Dreame!</h1>

    <div id="contenido">
      <div class="estado-cargando">⏳</div>
      <p>Aceptando invitación...</p>
    </div>
  </div>
</div>

<script>
  const codigo = "{{ codigo }}";

  async function aceptarInvitacion() {
    try {
      const res = await fetch("/api/listas/aceptar-invitacion/" + codigo, {
        method: "POST"
      });

      const datos = await res.json();

      if (res.ok) {
        // Éxito
        document.getElementById("contenido").innerHTML = `
          <div class="estado-exito">✅</div>
          <h2>¡Invitación aceptada!</h2>
          <p>Ya tienes acceso a la lista compartida.</p>
          <a href="/" class="boton-volver">Ir a la app</a>
        `;
      } else {
        // Error
        document.getElementById("contenido").innerHTML = `
          <div class="estado-error">❌</div>
          <h2>Algo salió mal</h2>
          <div class="mensaje-error">${datos.error || "No se pudo aceptar la invitación"}</div>
          <a href="/login" class="boton-volver">Volver a login</a>
        `;
      }
    } catch (error) {
      console.error("Error:", error);
      document.getElementById("contenido").innerHTML = `
        <div class="estado-error">❌</div>
        <h2>Error de conexión</h2>
        <div class="mensaje-error">No se pudo procesar la invitación</div>
        <a href="/login" class="boton-volver">Volver a login</a>
      `;
    }
  }

  // Aceptar invitación inmediatamente
  aceptarInvitacion();
</script>
</body>
</html>
