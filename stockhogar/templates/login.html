<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5, user-scalable=yes">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Dreame!</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script>
  (function () {
    var guardado = localStorage.getItem("stockhogar-tema");
    if (guardado) document.documentElement.dataset.theme = guardado;
  })();
</script>
<style>
  /* Estilos base para pantalla login */
  * {
    box-sizing: border-box;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    font-family: inherit;
    background: var(--background, #ffffff);
  }

  /* Solución para keyboard virtual en móvil */
  .pantalla-login {
    /* Usar dvh (dynamic viewport height) + fallback a vh */
    min-height: 100dvh;
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    /* Padding responsive: menos en móvil, más en desktop */
    padding: 16px;

    /* Asegurar que se ajusta cuando el keyboard aparece */
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;

    /* Para ios: soportar safe area */
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
    padding-top: max(16px, env(safe-area-inset-top));
    padding-bottom: max(16px, env(safe-area-inset-bottom));
  }

  .tarjeta-login {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);

    /* Padding optimizado para móvil */
    padding: 24px;

    width: 100%;
    max-width: 360px;

    /* Permitir shrink si es necesario, pero no crecer */
    flex-shrink: 1;
    min-width: 0;

    box-shadow: var(--shadow-md);
    display: flex;
    flex-direction: column;
    gap: 14px;

    /* Asegurar que el form no se oculta detrás del keyboard */
    position: relative;
    z-index: 10;

    /* Permitir scroll interno si es muy grande */
    max-height: 90dvh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .tarjeta-login h1 { margin: 0; font-size: 1.3rem; text-align: center; }
  .tarjeta-login p.subtitulo { margin: 0; text-align: center; color: var(--text-soft); font-size: 0.88rem; }
  .tarjeta-login label {
    display: flex;
    flex-direction: column;
    gap: 10px;
    font-size: 0.85rem;
    color: var(--text-soft);
    font-weight: 600;
  }
  /* Inputs optimizados para keyboard virtual */
  .tarjeta-login input {
    width: 100%;

    /* Padding: 12px mínimo para touch targets (recomendado 44x44px) */
    padding: 12px 14px;

    border-radius: var(--radius-sm);
    border: 2px solid var(--border);
    transition: border-color 0.2s, box-shadow 0.2s;

    /* Font size CRÍTICO: >16px previene zoom automático en iOS */
    font-size: 16px;

    color: var(--text);
    background: var(--surface-2);
    font-family: inherit;

    /* Asegurar box-sizing */
    box-sizing: border-box;

    /* Prevenir zoom automático en iOS */
    -webkit-user-zoom: 1;
    zoom: 1;

    /* Permitir input correcto en móvil */
    -webkit-appearance: none;
    appearance: none;

    /* Prevenir flashing en iOS */
    -webkit-tap-highlight-color: transparent;
  }

  /* Estados de focus y hover */
  .tarjeta-login input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.1);
  }

  .tarjeta-login input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-color: var(--accent);
  }

  /* Placeholder optimizado */
  .tarjeta-login input::placeholder {
    color: var(--text-soft);
    opacity: 0.7;
  }

  /* iOS: prevenir auto-fill styling */
  .tarjeta-login input:-webkit-autofill,
  .tarjeta-login input:-webkit-autofill:hover,
  .tarjeta-login input:-webkit-autofill:focus {
    -webkit-text-fill-color: var(--text);
    -webkit-box-shadow: 0 0 0px 1000px var(--surface-2) inset;
    box-shadow: 0 0 0px 1000px var(--surface-2) inset;
  }
  #seccionRegistro { display: none; }
  .tarjeta-login .primario {
    padding: 11px 18px;
    border-radius: var(--radius-sm);
    border: none;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    background: var(--accent);
    color: var(--accent-contrast);
  }
  .divider-oauth {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 8px 0;
    color: var(--text-soft);
    font-size: 0.85rem;
  }
  .divider-oauth::before,
  .divider-oauth::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  .oauth-buttons {
    display: flex;
    gap: 10px;
    flex-direction: column;
  }
  .oauth-button {
    padding: 11px 18px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    background: var(--surface-2);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    text-decoration: none;
    transition: background 0.2s;
  }
  .oauth-button:hover { background: var(--surface-3); }
  .oauth-button.google { --accent-oauth: #1F2937; }
  .oauth-button.apple { --accent-oauth: #000000; }
  @media (prefers-color-scheme: dark) {
    .oauth-button.apple { --accent-oauth: #ffffff; }
  }

  /* ========== MEDIA QUERIES - RESPONSIVE KEYBOARD HANDLING ========== */

  /* Móviles pequeños: iPhone SE, Galaxy A (320-480px) */
  @media (max-width: 480px) {
    .pantalla-login {
      padding: 8px;
      padding-left: max(8px, env(safe-area-inset-left));
      padding-right: max(8px, env(safe-area-inset-right));
    }

    .tarjeta-login {
      padding: 20px;
      gap: 12px;
      max-height: 95dvh;
    }

    .tarjeta-login h1 { font-size: 1.15rem; }

    .tarjeta-login input {
      padding: 14px 12px;
      font-size: 16px;
      min-height: 48px;
    }

    .tarjeta-login label {
      gap: 8px;
    }
  }

  /* Tablets pequeñas: 481-768px */
  @media (min-width: 481px) and (max-width: 768px) {
    .pantalla-login {
      padding: 20px;
    }

    .tarjeta-login {
      padding: 28px;
      max-width: 400px;
      max-height: 85dvh;
    }

    .tarjeta-login input {
      font-size: 16px;
      min-height: 48px;
    }
  }

  /* Tablets grandes y iPads: 769px+ */
  @media (min-width: 769px) {
    .pantalla-login {
      padding: 20px;
    }

    .tarjeta-login {
      padding: 32px;
      max-width: 420px;
      max-height: 90dvh;
    }

    .tarjeta-login input {
      font-size: 16px;
      min-height: 44px;
    }
  }

  /* Landscape mode: reducir altura vertical */
  @media (orientation: landscape) and (max-height: 600px) {
    .pantalla-login {
      min-height: 100dvh;
      justify-content: flex-start;
      padding-top: 8px;
      padding-bottom: 8px;
    }

    .tarjeta-login {
      padding: 16px 24px;
      gap: 10px;
      max-height: 100%;
    }

    .tarjeta-login h1 { font-size: 1rem; margin: 0 0 8px 0; }
    .tarjeta-login p.subtitulo { font-size: 0.8rem; margin: 0 0 8px 0; }
    .tarjeta-login label { gap: 6px; font-size: 0.8rem; }
    .tarjeta-login input { padding: 10px 12px; font-size: 15px; }
  }

  /* iPhone X+ notch support */
  @supports (padding: max(0px)) {
    .pantalla-login {
      padding-left: max(16px, env(safe-area-inset-left));
      padding-right: max(16px, env(safe-area-inset-right));
      padding-bottom: max(16px, env(safe-area-inset-bottom));
    }
  }

  /* Prevenir zoom automático en iOS Safari */
  @media (max-width: 768px) {
    input[type="text"],
    input[type="email"],
    input[type="password"],
    textarea,
    select {
      font-size: 16px !important;
    }
  }

  /* High DPI screens: mejorar nitidez */
  @media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 2dppx) {
    .tarjeta-login {
      border-width: 1px;
    }

    .tarjeta-login input {
      border-width: 2px;
    }
  }

  /* Dark mode en iOS 13+ */
  @supports (padding: max(0px)) {
    @media (prefers-color-scheme: dark) {
      .pantalla-login {
        background: var(--background);
      }
    }
  }

  /* Accesibilidad: movimiento reducido */
  @media (prefers-reduced-motion: reduce) {
    .tarjeta-login input {
      transition: none;
    }

    .tarjeta-login input:focus {
      transition: none;
    }
  }
</style>
</head>
<body>

<div class="pantalla-login">
  <form class="tarjeta-login" id="formLogin">
    <h1>📦 Dreame!</h1>
    <p class="subtitulo" id="subtituloForm">Inicia sesión para continuar.</p>

    <div id="seccionLogin">
      <label for="campoUsuario">Usuario</label>
      <input id="campoUsuario" name="usuario" type="text" required autocomplete="username" maxlength="40" placeholder="Tu usuario">
      <label for="campoPassword">Contraseña</label>
      <input id="campoPassword" name="password" type="password" required minlength="8" autocomplete="current-password" placeholder="Tu contraseña">
    </div>

    <div id="seccionRegistro">
      <label for="campoNombre">Nombre completo</label>
      <input id="campoNombre" name="nombre" type="text" maxlength="80" placeholder="Tu nombre">
      <label for="campoEmail">Email</label>
      <input id="campoEmail" name="email" type="email" maxlength="100" placeholder="tu@email.com">
      <label for="campoUsuarioReg">Usuario</label>
      <input id="campoUsuarioReg" name="usuario" type="text" required autocomplete="off" maxlength="40" placeholder="Tu usuario">
      <label for="campoPasswordReg">Contraseña</label>
      <input id="campoPasswordReg" name="password" type="password" required minlength="8" autocomplete="new-password" placeholder="Mínimo 4 caracteres">
      <label for="campoPassword2Reg">Confirma contraseña</label>
      <input id="campoPassword2Reg" name="password2" type="password" required minlength="8" autocomplete="new-password" placeholder="Confirma tu contraseña">
    </div>

    <p id="loginError" class="aviso" hidden></p>

    <button type="submit" class="primario" style="width: 100%; padding: 12px 18px;" id="btnFormulario">Entrar</button>

    <!-- Alternar entre login y registro -->
    <p style="text-align: center; margin-top: 16px; font-size: 0.9rem; display: flex; flex-wrap: nowrap; justify-content: center; align-items: center; gap: 6px; width: 100%;">
      <span id="textoAlternar" style="color: var(--text-soft); white-space: nowrap;">¿No tienes cuenta?</span>
      <button type="button" id="btnAlternarFormulario" style="background: none; border: none; color: var(--accent); cursor: pointer; font-weight: 600; white-space: nowrap;">Crea una</button>
    </p>

    {% if not modo_setup %}
    <div class="divider-oauth">o</div>
    <div class="oauth-buttons">
      <a href="/auth/google" class="oauth-button google">
        <span>🔷</span> Continuar con Google
      </a>
      <a href="/auth/apple" class="oauth-button apple">
        <span>🍎</span> Continuar con Apple
      </a>
    </div>
    {% endif %}
  </form>
</div>

<script>
  const modoSetup = {{ "true" if modo_setup else "false" }};
  const form = document.getElementById("formLogin");
  const error = document.getElementById("loginError");
  const btnAlternar = document.getElementById("btnAlternarFormulario");
  const seccionLogin = document.getElementById("seccionLogin");
  const seccionRegistro = document.getElementById("seccionRegistro");
  let esRegistro = modoSetup;

  // Inicializar según modo
  if (modoSetup) {
    mostrarRegistro();
  } else {
    mostrarLogin();  // Inicializar modo login por defecto
  }

  function mostrarLogin() {
    esRegistro = false;
    seccionLogin.style.display = "block";
    seccionRegistro.style.display = "none";
    // Deshabilitar inputs de registro para evitar errores de validación
    document.getElementById("campoUsuarioReg").disabled = true;
    document.getElementById("campoPasswordReg").disabled = true;
    document.getElementById("campoPassword2Reg").disabled = true;
    document.getElementById("subtituloForm").textContent = "Inicia sesión para continuar.";
    document.getElementById("btnFormulario").textContent = "Entrar";
    document.getElementById("textoAlternar").textContent = '¿No tienes cuenta?';
    document.getElementById("btnAlternarFormulario").textContent = "Crea una";
  }

  function mostrarRegistro() {
    esRegistro = true;
    seccionLogin.style.display = "none";
    seccionRegistro.style.display = "block";
    // Habilitar inputs de registro
    document.getElementById("campoUsuarioReg").disabled = false;
    document.getElementById("campoPasswordReg").disabled = false;
    document.getElementById("campoPassword2Reg").disabled = false;
    document.getElementById("subtituloForm").textContent = "Crea tu cuenta para empezar.";
    document.getElementById("btnFormulario").textContent = "Crear cuenta";
    document.getElementById("textoAlternar").textContent = '¿Ya tienes cuenta?';
    document.getElementById("btnAlternarFormulario").textContent = "Inicia sesión";
    document.getElementById("campoNombre").focus();
  }

  // ========== MANEJO DEL KEYBOARD VIRTUAL ==========
  // Detectar cuando el keyboard aparece/desaparece
  function manejarKeyboard() {
    const pantalla = document.querySelector(".pantalla-login");
    const tarjeta = document.querySelector(".tarjeta-login");

    if (!pantalla || !tarjeta) return;

    // iOS: usar visualViewport
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", function() {
        const keyboardHeight = window.innerHeight - window.visualViewport.height;

        if (keyboardHeight > 50) {
          // Keyboard visible
          pantalla.style.paddingBottom = "8px";
          tarjeta.style.maxHeight = Math.max(
            window.visualViewport.height - 20,
            200
          ) + "px";
          tarjeta.style.overflow = "auto";

          // Scroll para asegurar que el input enfocado sea visible
          setTimeout(() => {
            const inputEnfocado = document.activeElement;
            if (inputEnfocado && inputEnfocado.tagName === "INPUT") {
              inputEnfocado.scrollIntoView({ behavior: "smooth", block: "center" });
            }
          }, 100);
        } else {
          // Keyboard oculto
          pantalla.style.paddingBottom = "max(16px, env(safe-area-inset-bottom))";
          tarjeta.style.maxHeight = "90dvh";
        }
      });
    }

    // Android: detectar cambios en window.innerHeight
    let alturaAnterior = window.innerHeight;

    window.addEventListener("resize", function() {
      const alturaActual = window.innerHeight;
      const diferencia = alturaAnterior - alturaActual;

      // Si la altura cambió significativamente (> 50px), probablemente es el keyboard
      if (Math.abs(diferencia) > 50) {
        if (diferencia > 0) {
          // Keyboard apareció (altura disminuyó)
          tarjeta.style.maxHeight = alturaActual + "px";
          tarjeta.style.overflow = "auto";
        } else {
          // Keyboard desapareció (altura aumentó)
          tarjeta.style.maxHeight = "90dvh";
        }
      }

      alturaAnterior = alturaActual;
    });
  }

  // Ejecutar cuando DOM esté listo
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", manejarKeyboard);
  } else {
    manejarKeyboard();
  }

  // ========== EVENT LISTENERS ==========
  btnAlternar.addEventListener("click", () => {
    esRegistro ? mostrarLogin() : mostrarRegistro();
  });

  // Asegurar que los inputs se vean cuando reciben focus
  const inputs = document.querySelectorAll(".tarjeta-login input");
  inputs.forEach(input => {
    input.addEventListener("focus", function() {
      // Pequeño delay para que el keyboard termine de aparecer
      setTimeout(() => {
        this.scrollIntoView({ behavior: "smooth", block: "center" });
      }, 300);
    });
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    error.hidden = true;

    if (esRegistro) {
      // Flujo de registro
      const usuario = document.getElementById("campoUsuarioReg").value.trim();
      const password = document.getElementById("campoPasswordReg").value;
      const password2 = document.getElementById("campoPassword2Reg").value;
      const email = document.getElementById("campoEmail").value.trim();

      if (password !== password2) {
        error.textContent = "Las contraseñas no coinciden";
        error.hidden = false;
        return;
      }

      const resRegistro = await fetch("/api/auth/registrar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ usuario, password, email }),
      });
      const datosRegistro = await resRegistro.json();
      if (!resRegistro.ok) {
        error.textContent = datosRegistro.error || "No se pudo crear la cuenta";
        error.hidden = false;
        return;
      }

      // Backend ya inicia sesión automáticamente - redirigir directo
      window.location.href = "/?crear_primera_lista=true";
    } else {
      // Flujo de login
      const usuario = document.getElementById("campoUsuario").value.trim();
      const password = document.getElementById("campoPassword").value;

      const res = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ usuario, password }),
      });
      const datos = await res.json();
      if (!res.ok) {
        error.textContent = datos.error || "Usuario o contraseña incorrectos";
        error.hidden = false;
        return;
      }
      window.location.href = "/";
    }
  });
</script>
</body>
</html>
