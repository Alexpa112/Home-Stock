<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#B5551A">
<title>En mantenimiento - Dreame!</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
  body { margin: 0; background: var(--bg); color: var(--text); }
  .pantalla-mantenimiento {
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(12px, 4vw, 32px);
  }
  .tarjeta-mantenimiento {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-md);
    width: min(720px, 96vw);
    overflow: hidden;
    text-align: center;
  }
  .tarjeta-mantenimiento .escena-obras {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 320 / 220;
    background: var(--accent-soft);
  }
  .tarjeta-mantenimiento .contenido {
    padding: clamp(18px, 4vw, 36px) clamp(20px, 6vw, 48px) clamp(24px, 5vw, 40px);
  }
  .tarjeta-mantenimiento h1 {
    margin: 0 0 10px;
    font-size: clamp(1.25rem, 1rem + 1.6vw, 1.9rem);
    line-height: 1.25;
  }
  .tarjeta-mantenimiento p {
    color: var(--text-soft);
    margin: 0;
    font-size: clamp(0.95rem, 0.85rem + 0.4vw, 1.1rem);
  }
  .tarjeta-mantenimiento .mensaje-extra {
    margin-top: 16px;
    padding: 10px 14px;
    background: var(--surface-2);
    border-radius: var(--radius-sm);
    color: var(--text);
  }
  @media (max-height: 560px) {
    .pantalla-mantenimiento { align-items: flex-start; }
    .tarjeta-mantenimiento .escena-obras { max-height: 42vh; width: auto; margin: 0 auto; }
  }
</style>
</head>
<body>
<div class="pantalla-mantenimiento">
  <div class="tarjeta-mantenimiento">
    <img class="escena-obras" src="{{ url_for('static', filename='icons/mantenimiento.gif') }}" alt="" width="640" height="440">
    <div class="contenido">
      <h1 data-i18n="mantenimiento_titulo">En Tareas De Mantenimiento, Volveremos Pronto</h1>
      <p data-i18n="mantenimiento_texto">Volveremos en unos minutos.</p>
      {% if mensaje %}
      <div class="mensaje-extra">{{ mensaje }}</div>
      {% endif %}
    </div>
  </div>
</div>
<script src="{{ url_for('static', filename='i18n.js') }}"></script>
<script>
  // Comprueba periodicamente si el mantenimiento ha terminado y recarga
  // la pagina en automatico para que el usuario no tenga que hacerlo a mano.
  setInterval(async () => {
    try {
      const res = await fetch(window.location.href, { cache: "no-store" });
      if (res.status !== 503) {
        window.location.reload();
      }
    } catch (error) {
      console.error("Error comprobando el estado de mantenimiento:", error);
    }
  }, 10000);
</script>
</body>
</html>
