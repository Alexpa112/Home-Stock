# Dependabot lee este fichero de la RAMA POR DEFECTO del repositorio, que hoy
# es main. Pero el flujo del proyecto es dev2 -> produccion y main no se
# despliega ni se mantiene al dia, asi que sin `target-branch` los PR se abrian
# contra main: se acumularon 12 contra una rama congelada el 07-08-2026,
# proponiendo cambios sobre dependencias que en produccion ya no existen
# (python-Levenshtein, retirado al pasar a rapidfuzz) o que estan topadas a
# proposito (opencv-python-headless <=4.12.0.88, porque una version posterior
# dejo de publicar wheel para armv7l y rompio el build de la Raspberry Pi).
#
# Con `target-branch: "dev2"` dependabot lee los manifiestos de dev2 y abre los
# PR contra dev2, que es donde se revisan las dependencias antes de promocionar.
#
# Este fichero se mantiene IDENTICO en main, dev2 y produccion a proposito: al
# leerse solo el de la rama por defecto, tenerlo igual en las tres significa
# que cambiar cual es la rama por defecto no cambia a donde van los PR.
#
# `ignore`: versiones que NO se pueden adoptar y cuyos PR salian en rojo siempre.
#  - node: el frontend usa node:20 (LTS) y @types/node 20; saltar de major (25 no es
#    LTS) rompe `npm ci` y el build de Next. Se sube a mano al cambiar de LTS.
#  - python: las imagenes y el CI son Python 3.11; 3.12+ no tiene wheels para algunas
#    dependencias en armv7l (onnxruntime, opencv) y argostranslate/stanza fijan versiones.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "dev2"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "dev2"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "dev2"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
