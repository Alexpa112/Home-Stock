name: Docker build

on:
  push:
    branches: [dev2, produccion, main]
  pull_request:
    branches: [dev2, produccion, main]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image (Dockerfile, x86_64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: stockhogar-backend:ci

      - name: Escanear ticket PDF de prueba dentro del contenedor
        run: |
          docker run --rm -v "${{ github.workspace }}/tests/fixtures:/fixtures:ro" \
            stockhogar-backend:ci python3 -c "
          import shutil
          from stockhogar.rutas.tickets import _convertir_pdf_a_imagen
          from stockhogar.integraciones import ticket_ocr

          # /fixtures esta montado solo-lectura; igual que el endpoint real
          # (que trabaja siempre sobre un tempfile propio), se copia a una
          # ruta escribible antes de convertir, porque pdftoppm escribe el
          # PNG de salida junto al PDF de entrada.
          ruta_pdf = '/tmp/ticket_ejemplo.pdf'
          shutil.copy('/fixtures/ticket_ejemplo.pdf', ruta_pdf)

          ruta_png = _convertir_pdf_a_imagen(ruta_pdf)
          assert ruta_png, 'pdftoppm no genero la imagen'
          texto = ticket_ocr.extraer_texto(ruta_png)
          print('--- Texto OCR extraido ---')
          print(texto)
          assert texto.strip(), 'El OCR no devolvio texto'
          print('[OK] Escaneo de ticket PDF funciona en la imagen backend')
          "

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build frontend image (Dockerfile.frontend)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.frontend
          push: false
          tags: stockhogar-frontend:ci
