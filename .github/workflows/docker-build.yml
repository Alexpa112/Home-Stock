name: Docker build

on:
  push:
    branches: [dev2, produccion, main]
  pull_request:
    branches: [dev2, produccion, main]

# M-21: declarar permisos explícitos. Este workflow solo lee contenido.
permissions:
  contents: read

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image (Dockerfile, x86_64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: stockhogar-backend:ci

      - name: Escanear vulnerabilidades de la imagen backend (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: stockhogar-backend:ci
          severity: "CRITICAL,HIGH"
          # A-11: exit-code 1 bloquea si hay vulnerabilidades Críticas o Altas
          # en la imagen. Las vulnerabilidades de dependencias ya se cubren en
          # el job audit-deps de ci.yml; este job además detecta las que
          # pudieran introducir en la construcción propia del Dockerfile.
          exit-code: "1"

      - name: Escanear ticket PDF de prueba dentro del contenedor
        run: |
          docker run --rm -v "${{ github.workspace }}/tests/fixtures:/fixtures:ro" \
            stockhogar-backend:ci python3 -c "
          import shutil
          from stockhogar.rutas.tickets import _convertir_pdf_a_imagen
          from stockhogar.integraciones import ticket_ocr

          # /fixtures esta montado solo-lectura; igual que el endpoint real
          # (que trabaja siempre sobre un tempfile propio), se copia a una
          # ruta escribible antes de convertir, porque pdftoppm escribe el
          # PNG de salida junto al PDF de entrada.
          ruta_pdf = '/tmp/ticket_ejemplo.pdf'
          shutil.copy('/fixtures/ticket_ejemplo.pdf', ruta_pdf)

          ruta_png = _convertir_pdf_a_imagen(ruta_pdf)
          assert ruta_png, 'pdftoppm no genero la imagen'
          texto = ticket_ocr.extraer_texto(ruta_png)
          print('--- Texto OCR extraido ---')
          print(texto)
          assert texto.strip(), 'El OCR no devolvio texto'
          print('[OK] Escaneo de ticket PDF funciona en la imagen backend')
          "

  build-backend-raspbian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Se compila en la arquitectura nativa del runner (amd64), no armv7l:
      # el objetivo no es probar la imagen final de la Pi, sino que la propia
      # build (pip install + verificacion de imports de la linea 121) no se
      # rompa por dependencias desincronizadas con requirements.txt, que es
      # justo lo que dejo pasar antes a fuzzywuzzy tras migrar a rapidfuzz.
      - name: Build backend image (Dockerfile.raspbian, verificacion de build)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.raspbian
          push: false
          load: true
          tags: stockhogar-backend-raspbian:ci

      # Esta es la imagen que realmente se publica y se despliega en la Pi
      # (ver docker-publish.yml), así que también se escanea.
      - name: Escanear vulnerabilidades de la imagen backend-raspbian (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: stockhogar-backend-raspbian:ci
          severity: "CRITICAL,HIGH"
          exit-code: "1"

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build frontend image (Dockerfile.frontend)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.frontend
          push: false
          load: true
          tags: stockhogar-frontend:ci

      - name: Escanear vulnerabilidades de la imagen frontend (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: stockhogar-frontend:ci
          severity: "CRITICAL,HIGH"
          # A-11: igual que el backend, bloquea con exit-code 1
          exit-code: "1"
