name: Publicar imagenes precompiladas (GHCR)

# Compila las imagenes para armv7l (Raspberry Pi 32 bits) en un runner de
# GitHub (rapido, con RAM de sobra) y las publica en GHCR. install.sh en la
# Pi las descarga con "docker compose pull" en vez de compilarlas in-situ,
# evitando el build de next build/pip que colgaba la Raspberry Pi.
#
# A-10: este workflow se dispara SOLO cuando ci.yml termina exitosamente en
# produccion (conclusion == 'success'). Si los tests fallan, no se publica
# imagen ninguna. El cambio de "push" a "workflow_run" significa que esto
# corre como un segundo paso, despues de que CI pase.
on:
  workflow_run:
    workflows: [CI (tests y seguridad)]
    types: [completed]
    branches: [produccion]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  # Docker exige el nombre del repositorio en minúsculas; github.repository_owner
  # da "Alexpa112" (con mayúscula) y hace fallar el build con "repository name
  # must be lowercase". docker-compose.yml ya referencia estas imágenes en
  # minúsculas, así que se fija aquí en vez de derivarlo del contexto de GitHub.
  BACKEND_IMAGE: ghcr.io/alexpa112/home-stock-backend
  FRONTEND_IMAGE: ghcr.io/alexpa112/home-stock-frontend

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # A-10: bloquear la publicacion si el workflow_run de CI no fue exitoso.
      - name: Fallar si CI no paso
        if: github.event.workflow_run.conclusion != 'success'
        run: exit 1

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: QEMU (emula armv7l en el runner x86_64)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - uses: docker/setup-buildx-action@v3

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push backend (linux/arm/v7)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.raspbian
          platforms: linux/arm/v7
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build + push frontend (linux/arm/v7)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.frontend
          platforms: linux/arm/v7
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
