name: Publicar imagenes precompiladas (GHCR)

# Compila las imagenes para armv7l (Raspberry Pi 32 bits) en un runner de
# GitHub (rapido, con RAM de sobra) y las publica en GHCR. install.sh en la
# Pi las descarga con "docker compose pull" en vez de compilarlas in-situ,
# evitando el build de next build/pip que colgaba la Raspberry Pi.
on:
  push:
    branches: [produccion]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/home-stock-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/home-stock-frontend

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: QEMU (emula armv7l en el runner x86_64)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - uses: docker/setup-buildx-action@v3

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push backend (linux/arm/v7)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.raspbian
          platforms: linux/arm/v7
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build + push frontend (linux/arm/v7)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.frontend
          platforms: linux/arm/v7
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
