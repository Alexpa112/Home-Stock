name: Publicar imagenes precompiladas (GHCR)

# Compila las imagenes para armv7l (Raspberry Pi 32 bits) en un runner de
# GitHub (rapido, con RAM de sobra) y las publica en GHCR. install.sh en la
# Pi las descarga con "docker compose pull" en vez de compilarlas in-situ,
# evitando el build de next build/pip que colgaba la Raspberry Pi.
#
# A-10: este workflow se dispara SOLO cuando ci.yml termina exitosamente en
# produccion (conclusion == 'success'). Si los tests fallan, no se publica
# imagen ninguna. El cambio de "push" a "workflow_run" significa que esto
# corre como un segundo paso, despues de que CI pase.
on:
  workflow_run:
    workflows: [CI (tests y seguridad)]
    types: [completed]
    branches: [produccion]
  workflow_dispatch: {}

# Una publicacion a la vez: dos CI seguidos en produccion no deben pisarse el tag :latest.
concurrency:
  group: publicar-imagenes
  cancel-in-progress: false

env:
  # El commit EXACTO que paso el CI (head_sha del CI que dispara este workflow). No es
  # github.sha: en un workflow_run ese es el ultimo commit de la rama por defecto (main,
  # congelada), asi que todas las imagenes llevaban una etiqueta :sha inutil, y el checkout
  # por nombre de rama publicaba el ultimo commit de produccion aunque llegara otro despues de
  # pasar el CI. Con un disparo manual (workflow_dispatch) cae a github.sha.
  COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
  REGISTRY: ghcr.io
  # Docker exige el nombre del repositorio en minúsculas; github.repository_owner
  # da "Alexpa112" (con mayúscula) y hace fallar el build con "repository name
  # must be lowercase". docker-compose.yml ya referencia estas imágenes en
  # minúsculas, así que se fija aquí en vez de derivarlo del contexto de GitHub.
  BACKEND_IMAGE: ghcr.io/alexpa112/home-stock-backend
  FRONTEND_IMAGE: ghcr.io/alexpa112/home-stock-frontend

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # A-10: bloquear la publicacion si el workflow_run de CI no fue exitoso.
      # (solo aplica al disparo por workflow_run: con workflow_dispatch no hay CI previo.)
      - name: Fallar si CI no paso
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success'
        run: exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.COMMIT }}
          persist-credentials: false

      - name: QEMU (emula armv7l en el runner x86_64)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login en GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push backend (linux/arm/v7)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile.raspbian
          platforms: linux/arm/v7
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ env.COMMIT }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build + push frontend (linux/arm/v7)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile.frontend
          platforms: linux/arm/v7
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ env.COMMIT }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
