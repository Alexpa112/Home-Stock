services:
  stock-hogar:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stock-hogar
    restart: unless-stopped
    environment:
      PYTHONDONTWRITEBYTECODE: 1
      PYTHONUNBUFFERED: 1
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=2)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
