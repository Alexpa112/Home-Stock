services:
  stockhogar:
    # "image" fija el tag que usan tanto "docker compose pull" (descarga la
    # imagen precompilada por .github/workflows/docker-publish.yml, evitando
    # compilar en la Pi) como "docker compose build" (compilación local de
    # respaldo si el pull falla o no hay red hacia GHCR).
    image: ghcr.io/alexpa112/home-stock-backend:latest
    build:
      context: .
      dockerfile: Dockerfile.raspbian
    container_name: stockhogar-app
    ports:
      - "${STOCKHOGAR_PORT:-5000}:5000"
    # env_file inyecta TODAS las variables de .env (OAuth, SMTP, APP_URL...) que
    # stockhogar/config.py lee vía os.getenv. Sin esto, aunque el .env exista en
    # el host, el contenedor no las ve y el login OAuth / envío de invitaciones
    # por email quedan rotos en silencio.
    env_file:
      - .env
    environment:
      - FLASK_APP=stockhogar
      - FLASK_ENV=${FLASK_ENV:-production}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    restart: unless-stopped
    networks:
      - stockhogar-network
    # S-06: sin privilegios extra sobre el host (no-new-privileges bloquea
    # setuid/setgid ganar mas capacidades de las que ya tiene el proceso) y
    # limites de recursos acordes a una Raspberry Pi. read_only queda fuera
    # de esta fase (necesitaria auditar todo lo que la app escriba fuera de
    # data/logs/uploads).
    security_opt:
      - "no-new-privileges:true"
    mem_limit: 768m
    cpus: 1.5

  frontend:
    image: ghcr.io/alexpa112/home-stock-frontend:latest
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # "stockhogar" es el nombre del servicio de arriba: Docker lo resuelve
        # por DNS interno dentro de la red del compose, no localhost.
        NEXT_PUBLIC_API_URL: http://stockhogar:5000
    container_name: stockhogar-frontend
    ports:
      - "${STOCKHOGAR_FRONTEND_PORT:-3000}:3000"
    depends_on:
      - stockhogar
    restart: unless-stopped
    networks:
      - stockhogar-network
    security_opt:
      - "no-new-privileges:true"
    mem_limit: 512m
    cpus: 1.5

  # Postgres opt-in (Fase 1.5, ver docs/PROPUESTA_SEGURIDAD_Y_FUNCIONALIDADES.md).
  # NO se levanta con "docker compose up" a secas: solo con
  # "docker compose --profile postgres up". Mientras no se active, el
  # despliegue actual (SQLite) no cambia en nada.
  postgres:
    image: postgres:16-alpine
    container_name: stockhogar-postgres
    profiles:
      - postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-stockhogar}
      - POSTGRES_USER=${POSTGRES_USER:-stockhogar}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - stockhogar-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stockhogar} -d ${POSTGRES_DB:-stockhogar}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - stockhogar-network
    security_opt:
      - "no-new-privileges:true"
    mem_limit: 512m
    cpus: 1.0

networks:
  stockhogar-network:
    driver: bridge

volumes:
  stockhogar-postgres-data:
