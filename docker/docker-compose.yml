version: '3.8'

services:
  stockhogar:
    build:
      context: .
      dockerfile: Dockerfile.raspbian
    container_name: stockhogar-app
    ports:
      - "${STOCKHOGAR_PORT:-5000}:5000"
    environment:
      - FLASK_APP=stockhogar
      - FLASK_ENV=${FLASK_ENV:-production}
      - DATABASE_URL=sqlite:////app/data/stockhogar.db
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    restart: unless-stopped
    networks:
      - stockhogar-network

networks:
  stockhogar-network:
    driver: bridge
