<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2f2f74"/><stop offset="55%" stop-color="#1c1c4d"/><stop offset="100%" stop-color="#11112f"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#3d3d8a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3d3d8a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moonM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2cf"/><stop offset="100%" stop-color="#ffcf6e"/>
    </linearGradient>
    <linearGradient id="roofM" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#dcd7ee"/>
    </linearGradient>
    <linearGradient id="wallM" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f7f4fc"/><stop offset="100%" stop-color="#e5e0f2"/>
    </linearGradient>
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe8a8"/><stop offset="100%" stop-color="#ffc766"/>
    </linearGradient>
    <linearGradient id="chimneyM" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d9d2ef"/><stop offset="100%" stop-color="#c3bcdb"/>
    </linearGradient>
    <filter id="glowMoon" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowWindow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="houseShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <radialGradient id="groundShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="56" fill="url(#bgM)"/>
  <rect width="256" height="256" rx="56" fill="url(#vignette)"/>

  <!-- Stars -->
  <circle cx="41" cy="51" r="2.6" fill="#fff" opacity="0.75"/>
  <circle cx="61" cy="87" r="1.8" fill="#fff" opacity="0.55"/>
  <circle cx="31" cy="118" r="2" fill="#fff" opacity="0.6"/>
  <circle cx="87" cy="41" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="210" cy="148" r="2" fill="#fff" opacity="0.55"/>
  <!-- 4-point sparkle star accent -->
  <g transform="translate(56,148)" opacity="0.85">
    <path d="M0,-10 L2.5,-2.5 L10,0 L2.5,2.5 L0,10 L-2.5,2.5 L-10,0 L-2.5,-2.5 Z" fill="#fff"/>
  </g>

  <!-- Moon with glow + craters -->
  <circle cx="174" cy="77" r="28" fill="url(#moonM)" filter="url(#glowMoon)"/>
  <circle cx="186" cy="66" r="24" fill="url(#bgM)"/>
  <circle cx="161" cy="87" r="2.8" fill="#e8ad3f" opacity="0.35"/>
  <circle cx="169" cy="69" r="1.8" fill="#e8ad3f" opacity="0.3"/>

  <!-- Ground contact shadow -->
  <ellipse cx="128" cy="205" rx="67" ry="10" fill="url(#groundShadow)"/>

  <!-- Chimney (behind roof front, peeking) -->
  <rect x="154" y="61" width="18" height="36" fill="url(#chimneyM)"/>
  <rect x="152" y="59" width="21.5" height="5.6" fill="#c3bcdb"/>
  <!-- Smoke wisps -->
  <path d="M 163 56 Q 156 46 164 38 Q 172 31 167 20" fill="none" stroke="#e5e0f2" stroke-width="3.6" stroke-linecap="round" opacity="0.55"/>

  <!-- House group with shadow -->
  <g filter="url(#houseShadow)">
    <!-- Roof -->
    <path d="M 61 131 L 128 72 L 195 131 L 195 138 L 128 82 L 61 138 Z" fill="url(#roofM)"/>
    <!-- Roof ridge highlight line -->
    <line x1="128" y1="72" x2="128" y2="82" stroke="#c3bcdb" stroke-width="2.5"/>
    <!-- Roof texture lines (tiles) -->
    <path d="M 77 126 L 128 83.5 M 92 132 L 128 101.5 M 179 126 L 128 83.5 M 195 132 L 163.5 102.2" stroke="#cfc8e4" stroke-width="1.5" opacity="0.6"/>

    <!-- Wall -->
    <path d="M 69 133 L 187 133 L 187 190 Q 187 200 177 200 L 79 200 Q 69 200 69 190 Z" fill="url(#wallM)"/>

    <!-- Door -->
    <rect x="107" y="154" width="41" height="46" rx="5" fill="#3a3470"/>
    <rect x="112" y="159" width="31" height="19" rx="2.5" fill="none" stroke="#5d55a3" stroke-width="2"/>
    <circle cx="141" cy="178" r="2.3" fill="#d9d2ef"/>

    <!-- Window with warm glow -->
    <rect x="79" y="148" width="23" height="23" rx="3.8" fill="url(#windowGlow)" filter="url(#glowWindow)"/>
    <line x1="90.5" y1="148" x2="90.5" y2="171" stroke="#a9762a" stroke-width="1.5" opacity="0.5"/>
    <line x1="79" y1="159.5" x2="102" y2="159.5" stroke="#a9762a" stroke-width="1.5" opacity="0.5"/>
    <rect x="79" y="148" width="23" height="23" rx="3.8" fill="none" stroke="#c3bcdb" stroke-width="2"/>
  </g>
</svg>
