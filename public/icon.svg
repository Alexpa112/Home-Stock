<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5b7a99"/><stop offset="55%" stop-color="#486581"/><stop offset="100%" stop-color="#324a61"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#9fb8ce" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#9fb8ce" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="roofM" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#e8e4f4"/>
    </linearGradient>
    <linearGradient id="wallM" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#eeebf7"/>
    </linearGradient>
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe8a8"/><stop offset="100%" stop-color="#ffc766"/>
    </linearGradient>
    <linearGradient id="chimneyM" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8e4f4"/><stop offset="100%" stop-color="#d3ccea"/>
    </linearGradient>
    <filter id="glowWindow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="houseShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000" flood-opacity="0.32"/>
    </filter>
    <radialGradient id="groundShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="56" fill="url(#bgM)"/>
  <rect width="256" height="256" rx="56" fill="url(#vignette)"/>

  <!-- Ground contact shadow -->
  <ellipse cx="128" cy="203" rx="64" ry="9" fill="url(#groundShadow)"/>

  <!-- Chimney -->
  <rect x="154" y="63" width="17" height="32" fill="url(#chimneyM)"/>
  <rect x="152" y="61" width="20.5" height="5.4" fill="#d3ccea"/>

  <!-- House group with shadow -->
  <g filter="url(#houseShadow)">
    <!-- Roof -->
    <path d="M 61 131 L 128 72 L 195 131 L 195 138 L 128 82 L 61 138 Z" fill="url(#roofM)"/>
    <!-- Roof ridge highlight line -->
    <line x1="128" y1="72" x2="128" y2="82" stroke="#d3ccea" stroke-width="2.5"/>

    <!-- Wall -->
    <path d="M 69 133 L 187 133 L 187 190 Q 187 200 177 200 L 79 200 Q 69 200 69 190 Z" fill="url(#wallM)"/>

    <!-- Door -->
    <rect x="107" y="154" width="41" height="46" rx="6" fill="#3a4f66"/>
    <circle cx="141" cy="178" r="2.6" fill="#e8e4f4"/>

    <!-- Window with warm glow -->
    <rect x="79" y="148" width="23" height="23" rx="5" fill="url(#windowGlow)" filter="url(#glowWindow)"/>
  </g>
</svg>
